# Free nightly job (no Claude usage): fetch headlines + market prices, upload them, run the smoke test.
# Runs at 12:00 am Malaysia time. Needs the repository secret INGEST_KEY (the Supabase news write key).
name: Nightly news & checks
on:
  schedule:
    - cron: '0 16 * * *'    # 12:00 am Malaysia time: fetch, upload, test
    - cron: '30 17 * * *'   # 1:30 am Malaysia time: free Gemini summaries for anything still missing
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
  actions: write
jobs:
  nightly:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch headlines and market prices
        id: fetch
        run: python3 scripts/news_fetch.py
      - name: Upload headlines and prices
        id: upload
        env:
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: python3 scripts/news_upload.py --raw
      - name: Install test browser
        if: always()
        run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Smoke test (every lesson, view, language, simulator mode + live site)
        id: test
        if: always()
        run: node tests/smoke.js --live
      - name: Record result for the Claude task
        if: always()
        env:
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          FETCH: ${{ steps.fetch.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          TEST: ${{ steps.test.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/report_health.py
      - name: Open an issue when something failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `夜间检查失败 / Nightly check failed (${day})`,
              body: `今晚的自动检查有步骤失败。\n\n详情：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n凌晨 12:30 的 Claude 任务会读取这个结果并尝试修复。`
            });
      - name: Keep this scheduled workflow enabled (GitHub pauses idle repos after 60 days)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nightly.yml/enable" || true

  summaries:
    needs: [nightly]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 17 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free summaries with Gemini (only for headlines still without one)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: python3 scripts/news_summarize_gemini.py
